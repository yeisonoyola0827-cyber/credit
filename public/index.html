<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5169B7">
    <meta name="description" content="Escuela A.L.O. Arcade: experiencia interactiva de formación, onboarding, evaluación y analítica de Aló Credit. Arquitectura MVC PHP + SPA.">
    <title>Escuela A.L.O. | Level up · Tu talento transforma</title>
    <link rel="icon" type="image/png" href="./assets/logo.png">
    
    <!-- Hojas de Estilo Desacopladas (Rutas relativas para GitHub Pages y servidores locales) -->
    <link rel="stylesheet" href="./assets/css/app.css">
    <link rel="stylesheet" href="./assets/css/auth.css">
    <link rel="stylesheet" href="./assets/css/certificate.css">
</head>
<body>
    <div id="app-root">
        <!-- Renderizado dinámico de la SPA o Login -->
        <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Montserrat',sans-serif; color:#5169b7;">
            <div style="text-align:center;">
                <div style="font-size:48px; margin-bottom:12px;">★</div>
                <h2 style="margin:0;">Iniciando Escuela A.L.O....</h2>
            </div>
        </div>
    </div>

    <!-- Inyección de configuración global para SPA (Soporte GitHub Pages y modo offline) -->
    <script>
        // Configuración de rutas relativas y detección de servidor estático
        window.APP_BASE_URL = '.';
        if (
            window.location.protocol === 'file:' ||
            window.location.hostname.includes('github.io') ||
            window.location.hostname.includes('githubpreview.dev')
        ) {
            window.FORCE_STATIC_MODE = true;
        }
    </script>

    <!-- Scripts de la Aplicación -->
    <script src="./assets/js/sound.js"></script>
    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/course-player.js"></script>
    <script src="./assets/js/admin.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/spa.js"></script>
</body>
</html>
