@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
:root{--orange:#fa8514;--orange-hot:#f15824;--blue:#5169b7;--ink:#3e4a60;--fog:#e6e7f5;--white:#fff;--surface:#f8f9ff;--line:#e6ebf5;--muted:#71809b;--gold:#ffbb37;--green:#0c9376;--red:#ed5e52;--shadow:0 11px 38px rgba(60,74,96,.075);--shadow-heavy:0 22px 58px rgba(60,74,96,.14);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Montserrat',Arial,sans-serif;font-size:13px;margin:0;background:#f3f6fd;color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{text-decoration:none;color:inherit}img{max-width:100%}[hidden]{display:none!important}h1,h2,h3,h4,p{margin-top:0}h1{font-size:29px;letter-spacing:-1.2px;line-height:1.16}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:16px;letter-spacing:-.25px}p{line-height:1.65}small{font-size:11px}::selection{background:#fa85144a}svg{vertical-align:middle}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.app-shell{display:flex;min-height:100vh}.sidebar{width:252px;min-width:252px;position:sticky;top:0;left:0;align-self:flex-start;height:100vh;background:var(--blue);color:#fff;display:flex;flex-direction:column;padding:22px 16px 16px;overflow:auto;z-index:50;box-shadow:7px 0 28px rgba(81,105,183,.13)}.sidebar:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% -4%,#fff3 0 130px,transparent 132px),linear-gradient(150deg,#fff1,transparent 35%);pointer-events:none}.brand-pane{padding:13px 14px 12px;background:#fff;border-radius:18px;position:relative;box-shadow:0 11px 22px rgba(30,48,99,.17);margin-bottom:24px;text-align:center}.brand-pane img{display:block;object-fit:contain;height:55px;width:100%;margin:auto}.brand-bottom{font-weight:900;font-size:16px;letter-spacing:-.8px;color:var(--blue);white-space:nowrap}.brand-bottom b{color:var(--orange-hot)}.side-kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#fffe;font-weight:800;margin:6px 10px 9px}.side-nav{display:flex;flex-direction:column;gap:5px;position:relative}.nav-btn{border:0;background:transparent;width:100%;text-align:left;display:flex;gap:12px;align-items:center;color:#f8faff;padding:12px 13px;border-radius:13px;font-size:12px;font-weight:750;transition:background .16s,transform .16s}.nav-btn:hover{background:#fff2;transform:translateX(2px)}.nav-btn.active{background:#fff;color:var(--blue);box-shadow:0 7px 16px #1d2d6a30}.nav-btn.active .nav-icon{color:var(--orange-hot)}.nav-icon{display:inline-flex;font-size:17px;width:20px;justify-content:center;flex-shrink:0}.nav-tag{margin-left:auto;font-weight:900;color:#fff;background:var(--orange-hot);padding:2px 6px;border-radius:7px;font-size:9px}.side-divider{height:1px;background:#ffffff38;margin:16px 12px 13px}.side-bottom{margin-top:auto;position:relative;padding-top:24px}.side-achievement{background:#ffffff1e;border:1px solid #ffffff38;border-radius:16px;padding:14px;display:flex;align-items:center;gap:10px}.side-achievement span:first-child{font-size:28px}.side-achievement b{display:block;font-size:12px}.side-achievement small{color:#ffffffdb}.side-bottom p{font-size:10px;color:#ffffffdc;text-align:center;margin:14px 0 4px}
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{position:sticky;z-index:40;top:0;background:#fffc;backdrop-filter:blur(18px);border-bottom:1px solid #ecedf7;min-height:78px;display:flex;align-items:center;gap:17px;padding:15px 30px}.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}.topbar-greeting{display:block;font-weight:850;font-size:15px;color:var(--ink)}.topbar-sub{color:#8c96aa;display:block;font-size:10px;margin-top:3px}.topbar-spacer{flex:1}.top-search{display:flex;align-items:center;border:1px solid var(--line);background:#f7f8fd;border-radius:13px;min-width:170px;width:300px;padding:10px 12px;gap:10px}.top-search input{border:none;outline:0;min-width:0;width:100%;background:transparent;color:var(--ink);font-size:11px}.top-search svg{opacity:.6}.top-pill{background:#fff2ed;color:#d96610;border-radius:99px;padding:8px 11px;border:1px solid #ffe2ca;font-size:10px;font-weight:800;white-space:nowrap}.user-picker{display:flex;align-items:center;gap:9px}.user-avatar{width:37px;height:37px;background:linear-gradient(145deg,var(--orange),var(--orange-hot));display:grid;place-items:center;border-radius:13px;color:#fff;font-weight:900;flex-shrink:0;box-shadow:0 4px 9px #fa851433}.user-picker select{border:0;background:transparent;min-width:140px;max-width:180px;font-size:11px;color:var(--ink);font-weight:750;cursor:pointer}.hamburger{display:none;border:0;border-radius:11px;background:#f4f6fd;padding:9px;color:var(--blue)}
.page-root{padding:28px 32px 34px;flex:1;width:100%;max-width:1700px;margin:0 auto}.app-footer{padding:15px 32px 22px;color:#98a0b1;font-size:10px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}.eyebrow{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:1.4px;font-weight:900;color:var(--orange-hot);font-size:10px;margin-bottom:9px}.page-head p{color:var(--muted);margin:8px 0 0;font-size:12px}.section-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:25px 0 14px}.section-head h2{margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.section-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

<script>
/* Escuela A.L.O. - prototipo local de revisión UX.

*/
(() => {
'use strict';
const STORAGE_KEY='ESCUELA_ALO_DEMO_V5';
const DRIVE_URL='https://drive.google.com/drive/folders/1q1dyNq9wzEpxYaLaYo0Jd7RGs-JvWHnq?usp=sharing';
const DB_NAME='escuela-alo-demo-files';
const ROLES={cp:{label:'Comercial Presencial',short:'Comercial',icon:'🏪',color:'orange',focus:'Diagnóstico, propuesta, CRM y atención transparente'},cc:{label:'Contact Center',short:'Contact Center',icon:'🎧',color:'purple',focus:'Escucha, llamada, tipificación y seguimiento autorizado'},adm:{label:'Administrativos',short:'Administrativos',icon:'💻',color:'green',focus:'Control de datos, procesos y servicio al cliente interno'}};
const PILLARS={A:{name:'Aprendizaje',icon:'🧠',desc:'Dominar el rol, practicar y corregir con evidencia.'},L:{name:'Liderazgo',icon:'🤝',desc:'Convertir el aprendizaje en coaching y desarrollo.'},O:{name:'Obsesión por el cliente',icon:'⭐',desc:'Escuchar, explicar con transparencia y generar valor.'}};
const NAV=[['home','🏠','Inicio'],['onboarding','🗺️','Mi aventura A.L.O.'],['catalog','📚','Formación continua'],['leadership','🧭','Escuela de Liderazgo'],['evaluations','🧩','Evaluaciones'],['badges','🏆','Mis logros'],['progress','📈','Mi progreso']];
const ADMIN_TABS=[['dashboard','📊 Resumen'],['users','👥 Usuarios'],['courses','📚 Cursos y módulos'],['questions','🧩 Preguntas'],['rubrics','🧑‍🏫 Rúbricas'],['materials','📁 Materiales'],['reports','📈 Reportes'],['config','⚙️ Configuración']];
const UID=()=>`id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
const fmtDate=(v,withTime=false)=>v?new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',...(withTime?{timeStyle:'short'}:{})}).format(new Date(v)):'—';
const fmtMinutes=s=>s<60?'0 min':s<3600?`${Math.floor(s/60)} min`:`${Math.floor(s/3600)} h ${Math.floor(s%3600/60)} min`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pct=n=>`${Math.round(clamp(n,0,100))}%`;
const plural=(n,s)=>`${n} ${s}${n!==1?'s':''}`;

const button=(label,act,classes='btn-outline',extra='')=>`<button type="button" class="btn ${classes}" data-action="${act}" ${extra}>${label}</button>`;
const optionsFor=(vals,selected='')=>vals.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(l)}</option>`).join('');
const rolesOptions=(all=true)=>[...(all?[['all','Todos los roles']]:[]),...Object.entries(ROLES).map(([id,r])=>[id,r.label])];
const shortName=(name)=>String(name).split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase();
function mod(id,title,subtitle,story,concept,practice,reflection,estimated=35){return{id,title,subtitle,story,concept,practice,reflection,estimated};}
const mkPractice=(q,options,answer,feedback)=>({q,options,answer,feedback});
function onboardingModules(role){
 const r=ROLES[role];
 const specifics={
  cp:{tool:'CRM y registro de oportunidades',process:'Diagnóstico y propuesta responsable',case:'Una persona desea financiación y pregunta si su aprobación está garantizada.',solution:'Explicar que la aprobación depende de la evaluación vigente, verificar las condiciones actuales y registrar el seguimiento.',question:'¿Qué respuesta es adecuada ante una solicitud de aprobación garantizada?',answers:['Prometer aprobación para evitar perder la venta.','Verificar las condiciones vigentes y no garantizar aprobación.','Omitir información y terminar la atención.'],correct:1},
  cc:{tool:'Tipificación y CRM de llamadas',process:'Apertura, sondeo y seguimiento permitido',case:'Durante una llamada, la persona solicita revisar información de una cuenta sin completar la verificación de identidad.',solution:'Realizar el proceso de verificación correspondiente y no divulgar información sin validación.',question:'¿Qué corresponde hacer antes de compartir información sensible?',answers:['Continuar si la llamada parece confiable.','Solicitar una referencia verbal informal.','Aplicar el procedimiento autorizado de validación de identidad.'],correct:2},
  adm:{tool:'Calidad de datos y herramientas internas',process:'Control, autorización y trazabilidad',case:'Llega una solicitud urgente que requiere modificar un registro, pero no incluye la autorización requerida.',solution:'Pausar el trámite, solicitar la validación y registrar el caso y el escalamiento.',question:'¿Qué acción demuestra control ante una autorización faltante?',answers:['Modificar el dato sin autorización para cumplir el tiempo.','Detener la operación, verificar permisos y escalar.','Enviar el dato a un correo personal.'],correct:1}
 }[role];
 return[
  mod(`${role}-0`,'Prepara tu aventura','Día 0 · Alistamiento y accesos','Antes de una misión, cada explorador necesita sus herramientas. El aprendizaje comienza con accesos, agenda, acompañamiento y expectativas claras.','Confirma equipo y herramientas según el rol; correo y permisos; trámites definidos por GH; agenda de formación; líder o mentor asignado.',mkPractice('¿Qué se debe validar antes de iniciar la formación operativa?',['Únicamente la fecha de contratación.','Accesos, herramientas, agenda y apoyo según el rol.','Solo la velocidad de conexión.'],1,'El alistamiento evita obstáculos que no corresponden a brechas de aprendizaje.'),'Escribe cuál acceso o apoyo necesitas verificar con tu equipo.',10),
  mod(`${role}-1`,'Me conecto + me activo','Día 1 · Identidad y producto','Primera parada: descubre cómo Aló Credit convierte la financiación tecnológica en experiencias simples, claras y humanas.','Trabaja cultura y propósito, producto y experiencia, controles críticos, acceso seguro, expectativas y obsesión por el cliente. En formación presencial equivalen a 6 horas efectivas.',mkPractice('¿Qué debe primar al explicar productos financieros?',['Promesas de aprobación para agilizar cierres.','Lenguaje claro, condiciones vigentes y transparencia.','Afirmaciones no verificadas sobre beneficios.'],1,'La transparencia y la exactitud de producto son condiciones del buen servicio.'),'Propón una frase breve para explicar con claridad el siguiente paso del cliente.',360),
  mod(`${role}-2`,'Comprendo + actúo','Día 2 · Herramienta, flujo y simulación',specifics.case,`Herramienta clave: ${specifics.tool}. Flujo esencial: ${specifics.process}. Incluye simulación de un caso habitual y otro de excepción, y evaluación para iniciar práctica supervisada.`,mkPractice(specifics.question,specifics.answers,specifics.correct,specifics.solution),'Describe el control que aplicarías y cómo dejarías evidencia en la herramienta autorizada.',360),
  mod(`${role}-3`,'Misión en el puesto','Días 3–7 · Canguro supervisado','El mentor demuestra, observa y retroalimenta. La autonomía no depende solo de haber asistido a clase.','Día 3: observar y explicar decisiones. Días 4–5: ejecutar acompañado. Días 6–7: desarrollar casos con rúbrica. La ampliación del alcance exige ≥85/100 y cero errores críticos.',mkPractice('¿Cuándo corresponde ampliar el alcance de autonomía?',['Cuando termina el primer día de clase.','Cuando el mentor está ocupado.','Tras demostrar desempeño, cumplir la rúbrica y evitar errores críticos.'],2,'La habilitación requiere evidencia de la práctica, no únicamente asistencia.'),'Escribe una acción que pedirías observar al mentor antes de ejecutar sin apoyo.',45),
  mod(`${role}-4`,'Refuerza tus poderes','Días 8–30 · Cuatro clínicas','Llegó el momento de fortalecer tus puntos de mejora con práctica, feedback y nuevas decisiones.','El primer mes incluye cuatro clínicas de 120 minutos (8 horas): 45 minutos de caso, 45 minutos de práctica y 30 minutos de evaluación o plan de acción. El foco cambia según el rol.',mkPractice('¿Para qué se realizan las clínicas durante los primeros 30 días?',['Para repetir la teoría sin revisar casos.','Para trabajar brechas reales con práctica y evidencia.','Para reemplazar el acompañamiento operativo.'],1,'Las clínicas son refuerzos situados en problemas observables del puesto.'),'Identifica una dificultad frecuente de tu rol y una acción de mejora medible.',480),
  mod(`${role}-5`,'El reto final A.L.O.','Evaluación y habilitación','Has llegado al portal de certificación. La Escuela revisa conocimiento, práctica y comportamientos antes de recomendar la habilitación.','Modelo propuesto: 50% comportamientos observables + 50% BOT o reto. Umbrales: quiz ≥80%, práctica ≥85/100, total ≥80/100 y cero críticos. La rúbrica debe ser validada por Formación y líder.',mkPractice('¿Cuál de estos resultados NO permite habilitación?',['Total 88, práctica 90 y cero errores críticos.','Total 95 y un error crítico de validación de identidad.','Total 90, práctica 88 y cero errores críticos.'],1,'Un error crítico bloquea la habilitación, incluso si la nota total es alta.'),'Explica por qué un resultado de aprendizaje no equivale por sí solo a autonomía operativa.',60)
 ];
}
function continuousModules(id,title,skill,example){
 return[
  mod(`${id}-m1`,'Descubre el método',`Hard skill · ${skill}`,`Reto profesional: ${example}`,`Analiza qué requiere el rol para resolver el caso. Valida la información disponible, identifica el criterio de decisión y registra evidencia.`,mkPractice('¿Qué caracteriza una decisión profesional bien sustentada?',['Basarse en hechos y controles del proceso.','Improvisar para ahorrar tiempo.','Evitar registrar lo que ocurrió.'],0,'Las decisiones observables parten de datos y procedimientos vigentes.'),'¿Qué dato necesitarías comprobar antes de resolver el caso?',45),
  mod(`${id}-m2`,'Pasa de la teoría a la acción','Simulación · Aplicación práctica',`Tienes una nueva misión: ${example}`,`Practica la situación y define una acción de mejora. El estándar incluye técnica del rol, comunicación, controles y evidencia.`,mkPractice('¿Cómo se comprueba la transferencia al puesto?',['Con la asistencia a un video.','Con una evidencia de aplicación y feedback.','Solo con un puntaje de participación.'],1,'La aplicación requiere observar qué cambió en la ejecución.'),'Redacta un compromiso de aplicación medible para los siguientes siete días.',45)
 ];
}
const Q=(id,courseId,text,options,answer,explanation,critical=false)=>({id,courseId,text,options,answer,explanation,critical});
function createSeed(){
 let courses=[];
 for(const [role,r] of Object.entries(ROLES)){
  courses.push({id:`onb-${role}`,title:`Onboarding · ${r.label}`,type:'Onboarding',pillar:'A',roles:[role],duration:720,icon:r.icon,color:r.color,description:`Tu aventura inicial: identidad, herramientas, práctica supervisada y evaluación. Ruta adaptada a ${r.label}.`,published:true,version:'1.0',modules:onboardingModules(role)});
 }
 const specs=[
  ['venta','Diagnóstico y propuesta de valor','Formación continua','O',['cp'],240,'🧭','orange','Diagnóstico, segmentación de necesidades y comunicación clara.','Un cliente no sabe cuál alternativa se ajusta a sus necesidades.'],
  ['objeciones','Objeciones y cierre responsable','Formación continua','A',['cp'],240,'🎯','gold','Manejo de objeciones, resiliencia y cierre sin presión indebida.','Un prospecto expresa dudas y rechaza la primera propuesta.'],
  ['guion','Guion flexible y escucha telefónica','Formación continua','O',['cc'],240,'🎧','purple','Sondeo, escucha activa y adaptación del guion.','Una llamada comienza con una objeción antes de explicar el interés de la persona.'],
  ['crm','CRM, tipificación y seguimiento','Formación continua','A',['cc'],240,'🗂️','blue','Registro consistente de interacciones y seguimiento autorizado.','Una atención quedó sin tipificación ni siguiente paso claro.'],
  ['datos','Calidad de datos y control interno','Formación continua','A',['adm'],240,'📊','green','Validación, conciliación y controles del proceso administrativo.','Se detecta una diferencia entre fuentes de información.'],
  ['interno','Servicio al cliente interno','Formación continua','O',['adm'],240,'🤝','gold','Acuerdos de servicio, handoff y comunicación con otras áreas.','Una solicitud interna se devuelve por falta de información.'],
  ['cultura','Cultura A.L.O. en acción','Formación continua','O',['cp','cc','adm'],90,'✨','orange','Identidad, aprendizaje y atención humana, con aplicación a cada cargo.','Una persona requiere una explicación clara y un siguiente paso verificable.'],
  ['coaching','Coaching con observación','Liderazgo','L',['cp','cc','adm'],60,'🚀','purple','Observación, feedback, acuerdos y seguimiento del equipo.','Un colaborador necesita feedback sobre un procedimiento crítico.'],
  ['feedback','Feedback y plan de mejora','Liderazgo','L',['cp','cc','adm'],60,'💬','blue','Conversaciones de desarrollo sustentadas en evidencia.','Un líder observa una brecha que puede corregirse con acompañamiento.']
 ];
 specs.forEach(([id,title,type,pillar,roles,duration,icon,color,description,scenario])=>courses.push({id,title,type,pillar,roles,duration,icon,color,description,published:true,version:'1.0',modules:continuousModules(id,title,description,scenario)}));
 const questions=[
  Q('qcp1','onb-cp','Un cliente te pide garantizar que le aprobarán el crédito. ¿Qué haces?',['Lo garantizo porque el cliente parece solvente.','Aclaro que depende de la evaluación vigente y no prometo aprobación.','Evito responder y registro la venta como cerrada.'],1,'Nunca se deben prometer aprobaciones o condiciones inexistentes.',true),
  Q('qcp2','onb-cp','Antes de proponer una alternativa debes…',['Diagnosticar la necesidad y validar información actualizada.','Ofrecer el mismo producto en todos los casos.','Omitir el diagnóstico si hay fila.'],0,'Un diagnóstico adecuado es la base de una propuesta responsable.'),
  Q('qcp3','onb-cp','Una interacción comercial debe quedar…',['En una libreta personal.','Sin registro hasta obtener el cierre.','Registrada en la herramienta autorizada con siguiente paso.'],2,'La trazabilidad permite seguimiento y control.'),
  Q('qcp4','onb-cp','Durante el acompañamiento, el mentor…',['Observa, retroalimenta y documenta evidencia.','Habilita automáticamente al terminar el día.','Delega todos los casos sin control.'],0,'El canguro requiere evidencia y rúbrica.'),
  Q('qcp5','onb-cp','¿Cuál es el criterio de salida a práctica supervisada?',['Solo asistencia.','Resultado mínimo, práctica ≥85 y ningún error crítico.','Únicamente completar videos.'],1,'La decisión integra conocimiento, ejecución y controles.'),
  Q('qcc1','onb-cc','La persona en la llamada solicita información sensible sin validar identidad. Debes…',['Compartirla si conoce datos generales.','Aplicar el protocolo de validación antes de continuar.','Pedirle que envíe información por un canal no autorizado.'],1,'La identidad es un control obligatorio.',true),
  Q('qcc2','onb-cc','Una buena tipificación en CRM permite…',['Dejar trazabilidad y orientar seguimiento autorizado.','Eliminar registros repetidos.','Sustituir cualquier procedimiento de privacidad.'],0,'Los registros completos mejoran la continuidad.'),
  Q('qcc3','onb-cc','El manejo de objeciones se basa en…',['Interrumpir para acelerar la llamada.','Presionar para cerrar de inmediato.','Escuchar, indagar y aclarar con transparencia.'],2,'El guion debe ser flexible y respetuoso.'),
  Q('qcc4','onb-cc','Al terminar una llamada corresponde…',['Confirmar acuerdos, registrar y definir siguiente paso permitido.','Terminar sin registro.','Garantizar aprobaciones para retener interés.'],0,'La gestión debe quedar trazada.'),
  Q('qcc5','onb-cc','¿Cuál acción expresa obsesión por el cliente?',['Utilizar una respuesta estándar incluso si no resuelve la duda.','Verificar comprensión y dar un siguiente paso claro.','Priorizar la duración por encima de controles críticos.'],1,'Escucha y claridad protegen la experiencia.'),
  Q('qad1','onb-adm','Recibes una solicitud urgente sin la autorización requerida. Debes…',['Ejecutar para cumplir el SLA.','Solicitar autorización, pausar y escalar con trazabilidad.','Enviar datos sensibles al correo personal para agilizar.'],1,'No ejecutar sin permiso o control obligatorio.',true),
  Q('qad2','onb-adm','¿Cuál es una evidencia útil de calidad de datos?',['Un resultado verbal sin soporte.','Un reporte sin fuente ni dueño.','Validación y conciliación documentada.'],2,'Las decisiones deben tener fuente y responsable.'),
  Q('qad3','onb-adm','Al transferir una solicitud a otra área, corresponde…',['Definir responsables, información completa y criterio de aceptación.','Omitir contexto para ser breve.','Cerrar el caso antes de confirmar recepción.'],0,'La claridad en el handoff reduce reproceso.'),
  Q('qad4','onb-adm','¿Qué debe priorizarse en un proceso con datos personales?',['Velocidad sin permisos.','Control de acceso y manejo conforme al procedimiento.','Uso de cuentas personales para compartir archivos.'],1,'Los controles de acceso protegen a los usuarios y a la organización.'),
  Q('qad5','onb-adm','Una mejora continua del proceso se demuestra con…',['Solo satisfacción verbal.','Una opinión sin medición.','Evidencia de antes/después y responsable.'],2,'El resultado debe ser observable y verificable.')
 ];
 for(const c of courses.filter(x=>x.type!=='Onboarding')){

function courseCard(c){const prog=courseProgress(c),la=lastAttempt(c.id);return`<article class="card course-card"><div class="course-cover ${c.color||'blue'}"><span class="course-cover-label">${esc(c.type.toUpperCase())} · ${esc(PILLARS[c.pillar]?.name||'A.L.O.')}</span><span class="course-cover-icon" aria-hidden="true">${c.icon||'🎮'}</span></div><div class="course-body"><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="course-meta">${pill(c.type==='Onboarding'?'12 h iniciales + práctica':`${c.duration} min`)}${pill(`${c.modules.length} misiones`)}${la?pill(`${la.score}%`,la.passed?'green':'red'):''}</div><div class="progress-track"><div class="progress-fill ${prog===100?'green':''}" style="width:${prog}%"></div></div><div class="course-footer"><small>${pct(prog)} completado</small><button class="btn btn-small btn-primary" data-action="open-course" data-id="${esc(c.id)}">${prog>0?'Continuar':'Explorar'} →</button></div></div></article>`}
function renderOnboarding(){const c=myOnboarding(),done=c.modules.filter(x=>compl(me().id,x.id)).length;return`${head('🗺️ Tu aventura A.L.O.','Onboarding por roles',`2 días de formación inicial (12 h efectivas) + práctica supervisada, refuerzos y habilitación.`,button('📖 Ver plan de ruta','onboarding-info','btn-outline'))}<div class="level-intro"><div class="level-summary"><span class="medal">${ROLES[me().role].icon}</span><div><h2>${esc(ROLES[me().role].label)}</h2><p>Tu progreso: ${done} de ${c.modules.length} misiones · ${pct(courseProgress(c))} completado</p><div class="timeline-info">${pill('Días 1–2: 12 h','orange')}${pill('Días 3–7: canguro')}${pill('Días 8–30: 8 h clínicas')}</div></div></div>${button('Cambiar rol de muestra','role-modal','btn-soft')}</div><div class="level-grid">${c.modules.map((m,i)=>{const finished=compl(me().id,m.id),unlocked=isUnlocked(c,i);return`<article class="card level-card ${finished?'finished':unlocked?'current':'locked'}"><div class="level-num">NIVEL ${i} · ${esc(m.subtitle)}</div><div class="level-large">${['🧰','🌈','🎯','🎮','⚡','🏆'][i]}</div><h3>${esc(m.title)}</h3><p>${esc(m.story)}</p>${pill(finished?'Completado':unlocked?'Disponible':'Bloqueado',finished?'green':unlocked?'orange':'dark')}<button class="btn ${unlocked?'btn-primary':'btn-outline'} btn-wide" data-action="open-level" data-id="${c.id}" data-index="${i}" ${unlocked?'':'disabled'}>${finished?'Revisar misión':unlocked?'¡Jugar misión!':'Completa anterior'} →</button></article>`}).join('')}</div><div class="note-panel" style="margin-top:18px"><strong>Importante:</strong> superar retos digitales no habilita autonomía operativa. La aprobación del onboarding requiere validación de conocimiento, práctica con rúbrica, comportamientos observables y ausencia de errores críticos. La fórmula 50/50 es propuesta y debe aprobarse antes de operación.</div>`}
function renderCatalog(){const matches=data.courses.filter(c=>c.published).filter(c=>(ui.filterRole==='all'||c.roles.includes(ui.filterRole))).filter(c=>ui.filterType==='all'||c.type===ui.filterType).filter(c=>ui.filterPillar==='all'||c.pillar===ui.filterPillar).filter(c=>!ui.search||`${c.title} ${c.description}`.toLowerCase().includes(ui.search.toLowerCase()));return`${head('📚 Biblioteca de poder','Explora tu formación continua','Cursos por rol, desarrollo de liderazgo y retos a la medida.',button('Crear curso (demo)','create-course','btn-primary'))}<div class="filter-row"><input id="catalog-search" class="text-input" style="width:250px" placeholder="Buscar por nombre o tema" value="${esc(ui.search)}" aria-label="Buscar cursos"><select id="filter-role" class="select">${optionsFor(rolesOptions(),ui.filterRole)}</select><select id="filter-type" class="select">${optionsFor([['all','Todos los tipos'],['Onboarding','Onboarding'],['Formación continua','Formación continua'],['Liderazgo','Liderazgo'],['A la medida','A la medida']],ui.filterType)}</select><select id="filter-pillar" class="select">${optionsFor([['all','Todos los pilares'],...Object.entries(PILLARS).map(([k,p])=>[k,p.name])],ui.filterPillar)}</select></div><div class="course-grid">${matches.length?matches.map(courseCard).join(''):`<div class="empty-state"><div>🔎</div><h3>No encontramos misiones</h3><p>Prueba otros filtros.</p></div>`}</div>`}

function renderEvaluations(){let relevant=data.courses.filter(c=>myCourse(c)&&c.published);return`${head('🧩 Zona de retos','Evaluaciones y desafíos','Demuestra lo aprendido con preguntas basadas en el plan de formación 2026.',button('Cómo se evalúa','quiz-info','btn-outline'))}<div class="note-panel" style="margin-bottom:18px"><strong>Entorno de demostración:</strong> las notas se calculan localmente y NO son válidas para habilitación. En producción, la calificación y las respuestas deberán procesarse en un servidor seguro.</div><div class="card">${relevant.map(c=>{const qs=data.questions.filter(q=>q.courseId===c.id);const last=lastAttempt(c.id);const quizReady=c.type!=='Onboarding'||isUnlocked(c,c.modules.length-1);return`<div class="metric-row"><div style="font-size:28px">${c.icon}</div><div style="flex:1"><strong>${esc(c.title)}</strong><small>${qs.length} preguntas · Umbral ${data.settings.quizPass}% · ${c.type}</small></div>${last?pill(`Última: ${last.score}%`,last.passed?'green':'red'):pill('Sin intento')}<button class="btn btn-small ${quizReady?'btn-primary':'btn-outline'}" data-action="start-quiz" data-id="${c.id}" ${quizReady?'':'disabled'}>${quizReady?'Resolver →':'🔒 Ruta pendiente'}</button></div>`}).join('')}</div>${section('Historial de evaluaciones','Intentos guardados en este navegador')}${attemptsTable(myAttempts().slice().sort((a,b)=>b.date.localeCompare(a.date)))}`}
function attemptsTable(attempts){return`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Usuario</th><th>Curso</th><th>Nota</th><th>Resultado</th></tr></thead><tbody>${attempts.length?attempts.map(a=>{const u=data.users.find(x=>x.id===a.uid),c=byId(a.courseId);return`<tr><td>${fmtDate(a.date,true)}</td><td>${esc(u?.name||'Usuario')}</td><td>${esc(c?.title||'Curso archivado')}</td><td><strong>${a.score}%</strong></td><td>${pill(a.passed?'Aprueba':'Refuerzo',a.passed?'green':'red')}${a.criticalWrong?` ${pill('Crítico','red')}`:''}</td></tr>`}).join(''):`<tr><td colspan="5">Sin intentos registrados.</td></tr>`}</tbody></table></div>`}
function renderBadges(){const badges=issuedBadges();const unlocked=badges.filter(b=>b.earned).length;return`${head('🏆 Tu vitrina de logros','Mis medallas y certificados','Cada insignia reconoce una práctica, una decisión o una evaluación completada.',button('Ver certificado demo','certificate','btn-outline'))}<div class="xp-card" style="margin-bottom:20px"><span>🏆</span><div style="flex:1"><b>${me().xp} XP · Nivel ${Math.floor(me().xp/500)+1}</b><small>${unlocked} de ${badges.length} medallas desbloqueadas</small></div><span class="xp-spark">${unlocked}/${badges.length}</span></div><div class="badge-grid">${badges.map(b=>`<article class="card award ${b.earned?'':'muted'}"><div class="award-symbol">${b.icon}</div><h3>${esc(b.name)}</h3><p>${esc(b.desc)}</p>${pill(b.earned?'Desbloqueada':'Bloqueada',b.earned?'green':'dark')}</article>`).join('')}</div><div class="note-panel" style="margin-top:18px">Los certificados de esta etapa son vistas de demostración sin validez institucional ni firma digital. No se envían a Google Drive.</div>`}
function renderProgress(){const u=me(),atts=myAttempts().sort((a,b)=>b.date.localeCompare(a.date)),cc=data.completions.filter(x=>x.uid===u.id),sess=data.sessions.filter(x=>x.uid===u.id);const own=data.courses.filter(c=>myCourse(c));return`${head('📈 Tus estadísticas','Mi progreso','Una mirada clara a lo aprendido y a lo que viene.',button('↓ Exportar mis datos (CSV)','export-mine','btn-outline'))}<div class="kpi-grid">${metric('⏱️','Tiempo activo',fmtMinutes(u.activeSeconds||0),'Medición local estimada','blue')}${metric('✅','Módulos completados',cc.length,'Acciones de aprendizaje','green')}${metric('🧩','Evaluaciones',atts.length,'Intentos registrados','gold')}${metric('🎯','Promedio',scoreAvg()===null?'—':pct(scoreAvg()),'Notas de muestra')}</div><div class="admin-grid" style="margin-top:18px"><article class="card"><div class="card-header"><h3>🗺️ Avance por curso</h3></div>${own.map(c=>`<div class="metric-row"><div style="min-width:0;flex:1"><strong>${esc(c.title)}</strong><small>${c.modules.filter(m=>compl(u.id,m.id)).length} / ${c.modules.length} misiones</small><div class="progress-track" style="height:7px;margin:7px 0 0"><div class="progress-fill" style="width:${courseProgress(c)}%"></div></div></div><div class="metric-value">${pct(courseProgress(c))}</div></div>`).join('')}</article><article class="card"><div class="card-header"><h3>🕒 Historial de accesos</h3></div><div class="metric-row"><div><strong>Primer registro demo</strong><small>${fmtDate(u.createdAt,true)}</small></div></div><div class="metric-row"><div><strong>Último ingreso</strong><small>${fmtDate(u.lastLogin,true)}</small></div></div>${sess.slice(-6).reverse().map(s=>`<div class="metric-row"><div><strong>${fmtDate(s.start,true)}</strong><small>Sesión demostrativa</small></div><div class="metric-value" style="font-size:12px">${fmtMinutes(s.seconds)}</div></div>`).join('')}</article></div>${section('Mis intentos recientes','Resultados calculados o simulados y guardados localmente')}${attemptsTable(atts)}`}
function renderCourse(){const c=byId(ui.courseId);if(!c)return`${head('⚠️','Curso no disponible','Selecciona una ruta vigente.')}${button('Volver al catálogo','go-catalog')}`;let i=clamp(ui.moduleIndex,0,c.modules.length-1);ui.moduleIndex=i;const m=c.modules[i],finished=compl(me().id,m.id),unlocked=isUnlocked(c,i),isFinal=c.type==='Onboarding'&&i===c.modules.length-1;const phaseTitles=['Descubre','Aprende','Practica','Demuestra','Desbloquea'];const symbols=['🔎','📖','🎲','🧪','🏅'];const phase=ui.phase;let inner='';
 if(!unlocked){inner=`<div class="empty-state"><div>🔒</div><h3>Este nivel todavía está bloqueado</h3><p>Termina las misiones anteriores para avanzar.</p>${button('Volver a la ruta','go-onboarding','btn-primary')}</div>`}
 else if(phase===0){inner=`<div class="reading-panel"><span class="eyebrow">✨ Descubre tu misión</span><h2>Antes de empezar…</h2><p class="story-quote">“${esc(m.story)}”</p><p>Tu objetivo es comprender el desafío, aplicar criterios del rol y dejar evidencia.</p></div>`}
 else if(phase===1){inner=`<div class="reading-panel"><span class="eyebrow">📖 Aprende</span><h2>${esc(m.title)}</h2><p>${esc(m.concept)}</p><div class="note-panel"><strong>Regla A.L.O.:</strong> ¿Qué debes hacer? ¿Por qué importa? ¿Cómo lo demuestras? ¿Qué evidencia queda?</div></div>`}
 else if(phase===2){inner=`<div class="reading-panel"><span class="eyebrow">🎲 Practica · microreto</span><h2>${esc(m.practice.q)}</h2><p>Selecciona una respuesta y comprueba tu decisión.</p><div class="options-list">${m.practice.options.map((o,j)=>`<button class="option-btn ${ui.practiceAnswer===j?'selected':''}" data-action="practice-pick" data-index="${j}"><span class="option-letter">${String.fromCharCode(65+j)}</span>${esc(o)}</button>`).join('')}</div>${ui.practiceChecked?`<div class="note-panel" style="margin-top:14px"><strong>${ui.practiceAnswer===m.practice.answer?'✅ ¡Correcto!':'💡 Inténtalo de nuevo.'}</strong> ${esc(m.practice.feedback)}</div>`:''}</div>`}
 else if(phase===3){inner=`<div class="reading-panel"><span class="eyebrow">🧪 Demuestra</span><h2>Transforma lo aprendido en una acción</h2><p>${esc(m.reflection)}</p><label class="form-field"><span style="font-size:10px;font-weight:900">Evidencia de reflexión (solo demo, no subir datos reales)</span><textarea id="reflect-text" class="textarea" rows="5" placeholder="Escribe una acción concreta que aplicarías…">${esc(ui.reflection)}</textarea></label><p class="smallprint">Tu reflexión se registra localmente cuando completas la misión. Evita nombres, documentos o datos de clientes.</p></div>`}
 else{const earned=finished?0:70;inner=`<div class="reading-panel" style="text-align:center"><div style="font-size:53px;margin:2px 0 7px">${finished?'🏆':'🌟'}</div><h2>${finished?'¡Misión superada!':'¡Prepara tu recompensa!'}</h2><p>${isFinal?'El desafío final evalúa conocimiento, pero la habilitación operativa requiere validación adicional.':'Cierra este nivel para registrar tu evidencia y sumar puntos de experiencia.'}</p><div class="xp-card" style="max-width:390px;margin:16px auto"><span>⭐</span><div><b>+${earned} XP</b><small>${finished?'Ya recibiste el reconocimiento':'Al guardar la misión'}</small></div></div></div>`}
 const canNext=unlocked&&phase<4;
 return`${head('🎮 Jugando ahora',esc(c.title),`${esc(m.subtitle)} · ${esc(m.estimated)} min de duración pedagógica estimada`,button('← Volver a mis rutas','go-course-origin','btn-outline'))}<div class="course-shell"><div class="card course-play-header"><div class="play-world"><span class="mini-badge orange">NIVEL ${i} · ${esc(c.type.toUpperCase())}</span><h1>${esc(m.title)}</h1><p>Aprende jugando · Lidera con evidencia · Crece con propósito</p></div><div class="play-content"><div class="phase-nav" aria-label="Etapas de aprendizaje">${phaseTitles.map((name,j)=>`<button class="phase-btn ${j===phase?'current':j<phase?'passed':''}" data-action="phase-jump" data-index="${j}" ${!unlocked||j>phase?'disabled':''}>${symbols[j]} ${name}</button>`).join('')}</div>${inner}<div style="display:flex;gap:10px;justify-content:space-between;margin-top:21px;flex-wrap:wrap"><button class="btn btn-outline" data-action="phase-back" ${phase===0?'disabled':''}>← Volver</button><div class="section-actions">${phase===2&&!ui.practiceChecked?button('Comprobar decisión →','check-practice','btn-primary'):canNext?button('Continuar →','phase-next','btn-primary'):phase===4?(isFinal?button('🧩 Presentar reto final','start-quiz','btn-primary',`data-id="${c.id}"`):finished?button('Ir a la siguiente misión →','next-module','btn-primary'):button('✓ Finalizar misión · +70 XP','finish-module','btn-primary')):''}</div></div></div></div><aside><article class="card"><div class="card-header"><h3>🗺️ Mapa de la ruta</h3>${pill(`${pct(courseProgress(c))}`,'orange')}</div><div class="course-outline">${c.modules.map((mm,j)=>`<button class="outline-item ${j===i?'active':''}" data-action="select-module" data-index="${j}" ${isUnlocked(c,j)?'':'disabled'}><span class="outline-symbol">${compl(me().id,mm.id)?'✅':isUnlocked(c,j)?'🎮':'🔒'}</span><span class="outline-text"><b>${esc(mm.title)}</b><small>${esc(mm.subtitle)}</small></span></button>`).join('')}</div><div class="progress-track"><div class="progress-fill" style="width:${courseProgress(c)}%"></div></div></article><article class="card" style="margin-top:16px"><div class="card-header"><h3>📁 Recursos del curso</h3></div><p class="subtle" style="font-size:10px">Materiales cargados en esta demostración. En la fase 2 se vincularán con Drive.</p>${renderMaterialLinks(c.id)}${button('Gestionar materiales','admin-materials','btn-soft btn-wide','style="margin-top:12px"')}</article><div class="note-panel" style="margin-top:16px">${isFinal?'⚠️ La ruta digital no sustituye la valoración formal del mentor y del líder.':'✨ Completa las cinco etapas y explica cómo aplicarías lo aprendido en el puesto.'}</div></aside></div>`;
}
function renderMaterialLinks(courseId){const list=data.materials.filter(m=>m.courseId===courseId);return list.length?list.map(x=>`<div class="metric-row"><div style="font-size:19px">📎</div><div style="flex:1"><strong>${esc(x.name)}</strong><small>${Math.max(1,Math.round(x.size/1024))} KB</small></div><button class="btn btn-small btn-outline" data-action="view-file" data-id="${x.id}">Ver ↗</button></div>`).join(''):`<div style="font-size:11px;color:var(--muted);padding:6px 0">Sin archivos cargados en este navegador.</div>`}
function quizQuestions(){return ui.quiz?.questionIds.map(id=>data.questions.find(q=>q.id===id)).filter(Boolean)||[]}
function renderQuiz(){const q=ui.quiz;if(!q)return`<div class="empty-state">No hay evaluación activa. ${button('Ver evaluaciones','go-evaluations')}</div>`;const c=byId(q.courseId),items=quizQuestions();if(!items.length)return`${head('🧩 Evaluaciones','Sin preguntas disponibles','Crea preguntas desde el panel administrativo.')}${button('Volver','go-evaluations')}`;
 if(ui.quizResult){const a=ui.quizResult;return`${head('⭐ Resultado','Reto A.L.O. finalizado','Tu resultado fue calculado y guardado únicamente en este navegador.') }<article class="card quiz-result" style="max-width:720px;margin:0 auto"><div style="font-size:55px">${a.passed?'🏆':'🧩'}</div><div class="score-circle ${a.passed?'pass':''}">${a.score}%</div><h2>${a.passed?'¡Bien hecho! Superaste el desafío':'Una oportunidad para seguir aprendiendo'}</h2><p class="subtle">${a.correct} de ${a.total} respuestas correctas. ${a.criticalWrong?'Detectamos un error crítico simulado, por lo que no aprueba la misión.':'Sin errores críticos.'}</p>${pill(a.passed?'Aprobado en demo':'Plan de refuerzo',a.passed?'green':'red')}<div class="note-panel" style="margin:21px 0;text-align:left"><strong>Importante:</strong> ${c.type==='Onboarding'?'La nota cognitiva no es una habilitación operativa. Quedan pendientes la rúbrica de práctica, la observación de comportamientos y la validación del líder.':'Este resultado de demostración no equivale a certificación institucional.'}</div><div class="section-actions" style="justify-content:center">${button('Repetir evaluación','retry-quiz','btn-outline')}${button('Ver mis notas','go-evaluations','btn-primary')}</div></article>`}
 const i=q.index;const item=items[i];if(!item)return'';return`${head('🧩 Desafío de conocimiento',esc(c?.title||'Evaluación'),`Pregunta ${i+1} de ${items.length} · Aprobación de referencia ${data.settings.quizPass}%`,button('Salir del reto','go-evaluations','btn-outline'))}<div class="course-shell"><article class="card" style="min-height:410px"><div class="card-header"><h3>⚡ Reto ${i+1}</h3>${pill(item.critical?'Pregunta de control crítico':'Pregunta de conocimiento',item.critical?'red':'orange')}</div><div class="quiz-progress"><div style="width:${100*(i+1)/items.length}%"></div></div><p class="subtle">Selecciona una respuesta. Puedes revisar tus opciones antes de entregar.</p><h2 style="margin:23px 0 21px">${esc(item.text)}</h2><div class="options-list">${item.options.map((o,j)=>`<button class="option-btn ${q.answers[item.id]===j?'selected':''}" data-action="quiz-pick" data-index="${j}"><span class="option-letter">${String.fromCharCode(65+j)}</span>${esc(o)}</button>`).join('')}</div><div class="section-actions" style="justify-content:space-between;margin-top:23px"><button class="btn btn-outline" data-action="quiz-prev" ${i===0?'disabled':''}>← Anterior</button>${i===items.length-1?button('Entregar evaluación →','quiz-submit','btn-primary'):button('Siguiente pregunta →','quiz-next','btn-primary')}</div></article><aside class="card"><div class="card-header"><h3>🎯 Tu tablero</h3></div><div class="stat-hero">${Object.keys(q.answers).length}/${items.length}</div><p class="subtle" style="font-size:11px">Preguntas respondidas</p><div class="progress-track"><div class="progress-fill" style="width:${100*Object.keys(q.answers).length/items.length}%"></div></div><div class="note-panel" style="margin-top:16px">Las respuestas correctas no se muestran antes de entregar. En el entorno productivo estarán protegidas en el servidor.</div></aside></div>`}
function startQuiz(courseId){const c=byId(courseId);if(!c)return toast('Curso no encontrado.','error');if(c.type==='Onboarding'&&!isUnlocked(c,c.modules.length-1))return toast('Supera las misiones previas antes de presentar el reto final.','error');const ids=data.questions.filter(q=>q.courseId===courseId).map(q=>q.id);if(!ids.length)return toast('Este curso aún no tiene preguntas.','error');ui.quiz={courseId,questionIds:ids,index:0,answers:{}};ui.quizResult=null;ui.page='quiz';render();window.scrollTo(0,0)}
function endQuiz(){const q=ui.quiz;if(!q)return;const questions=quizQuestions();const missing=questions.filter(x=>q.answers[x.id]===undefined);if(missing.length){toast(`Faltan ${missing.length} respuestas por seleccionar.`,'error');q.index=questions.findIndex(x=>q.answers[x.id]===undefined);render();return}const correct=questions.filter(x=>q.answers[x.id]===x.answer).length;const criticalWrong=questions.some(x=>x.critical&&q.answers[x.id]!==x.answer);const score=Math.round(correct/questions.length*100);const passed=score>=data.settings.quizPass&&!criticalWrong;const rec={id:UID(),uid:me().id,courseId:q.courseId,date:new Date().toISOString(),correct,total:questions.length,score,criticalWrong,passed,source:'demostracion'};data.attempts.push(rec);if(passed){me().xp=(me().xp||0)+100;const c=byId(q.courseId);if(c.type==='Onboarding'&&isUnlocked(c,c.modules.length-1)&&!compl(me().id,c.modules.at(-1).id)){data.completions.push({uid:me().id,moduleId:c.modules.at(-1).id,date:new Date().toISOString()})}}ui.quizResult=rec;sessionEvent('evaluacion',`${q.courseId}: ${score}% · ${passed?'aprueba':'refuerzo'}`);render();}
function finishModule(){const c=byId(ui.courseId),m=c?.modules[ui.moduleIndex];if(!c||!m)return;if(c.type==='Onboarding'&&ui.moduleIndex===c.modules.length-1){return startQuiz(c.id)}if(!ui.practiceChecked||ui.practiceAnswer!==m.practice.answer)return toast('Comprueba la respuesta correcta antes de completar.','error');if(ui.reflection.trim().length<12)return toast('Escribe una reflexión breve (al menos 12 caracteres).','error');if(!compl(me().id,m.id)){data.completions.push({uid:me().id,moduleId:m.id,date:new Date().toISOString()});data.reflections.push({id:UID(),uid:me().id,moduleId:m.id,text:ui.reflection.trim(),at:new Date().toISOString()});me().xp=(me().xp||0)+70;sessionEvent('modulo_completado',m.title);toast('🌟 ¡Nivel completado! Sumaste 70 XP.','success')}else toast('Esta misión ya estaba completada.','success');render()}
function adminSummary(){const active=data.users.filter(u=>u.status==='Activo').length;const completed=data.completions.length;const totalSeconds=data.users.reduce((s,u)=>s+(u.activeSeconds||0),0);const avg=data.attempts.length?Math.round(data.attempts.reduce((s,a)=>s+a.score,0)/data.attempts.length):0;return`<div class="kpi-grid">${metric('👥','Usuarios activos',active,'Solo perfiles de muestra','blue')}${metric('📚','Cursos publicados',data.courses.filter(c=>c.published).length,'Contenidos editables')}${metric('✅','Módulos completados',completed,'Evidencias locales','green')}${metric('🎯','Nota promedio',`${avg}%`,'Intentos de demostración','gold')}</div><div class="admin-grid" style="margin-top:16px"><article class="card"><div class="card-header"><h3>📊 Actividad de aprendizaje</h3>${pill('Ejemplo ilustrativo','orange')}</div><div class="bar-chart">${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].map((x,i)=>`<div class="bar-col"><div class="bar-track"><div class="bar" style="height:${[12,25,32,44,55,74,62,79,65,87,68,83][i]}%"></div></div><small>${x}</small></div>`).join('')}</div><p class="smallprint">Gráfico ilustrativo de la propuesta visual; no representa actividad real ni reportes de Aló Credit.</p></article><article class="card"><div class="card-header"><h3>🎯 Indicadores del proceso</h3></div>${[['Comportamientos observables',data.settings.behaviors],['Apropiación del conocimiento',data.settings.knowledge],['Satisfacción formativa',data.settings.satisfaction]].map(([name,value])=>`<div class="metric-row"><div style="flex:1"><strong>${name}</strong><small>Meta configurada · pendiente de medición real</small></div><div class="metric-value">≥ ${value}%</div></div>`).join('')}<div class="note-panel" style="margin-top:17px"><strong>Sin backend:</strong> las metas no son resultados. Para medirlas se requiere capturar evaluaciones, observaciones y encuestas verificadas.</div></article></div>${section('Accesos de prueba','Últimos inicios de sesión en registros simulados')}${userTable(data.users.slice(0,5),false)}`}
function userTable(users,editable=true){return`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Colaborador</th><th>Rol</th><th>Área / gerencia</th><th>Cohorte</th><th>Estado</th><th>Último acceso</th>${editable?'<th>Gestión</th>':''}</tr></thead><tbody>${users.length?users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><div class="smallprint">${esc(u.email)}</div></td><td>${esc(fmtRole(u.role))}</td><td>${esc(u.area||'—')}<div class="smallprint">${esc(u.gerencia||'—')}</div></td><td>${esc(u.cohort||'—')}</td><td>${pill(u.status,u.status==='Activo'?'green':'red')}</td><td>${fmtDate(u.lastLogin,true)}</td>${editable?`<td><div class="data-actions"><button class="btn btn-small btn-outline" data-action="edit-user" data-id="${u.id}">Editar</button><button class="btn btn-small btn-soft" data-action="toggle-user" data-id="${u.id}">${u.status==='Activo'?'Pausar':'Activar'}</button></div></td>`:''}</tr>`).join(''):`<tr><td colspan="${editable?7:6}">Sin usuarios</td></tr>`}</tbody></table></div>`}
function adminUsers(){return`${section('Gestión de usuarios','Creación individual o importación CSV. Solo edición del prototipo.',`${button('↓ Plantilla CSV','template-users','btn-outline')}${button('↑ Importar CSV','import-users','btn-outline')}${button('+ Nuevo usuario','create-user','btn-primary')}`)}<div class="note-panel" style="margin-bottom:15px"><strong>Atención:</strong> no uses nombres, correos ni documentos reales. Esta fase guarda datos en el navegador, sin protección de acceso.</div>${userTable(data.users)}`}
function adminCourses(){if(ui.adminCourse){const c=byId(ui.adminCourse);if(!c){ui.adminCourse=null;return adminCourses()}return`${section(`Editor · ${esc(c.title)}`,`${esc(c.type)} · ${esc(c.version)} · ${c.modules.length} módulos`,`${button('← Volver al catálogo','admin-courses-back','btn-outline')}${button('Editar curso','edit-course','btn-soft',`data-id="${c.id}"`)}${button('+ Añadir módulo','create-module','btn-primary',`data-id="${c.id}"`)}`)}<div class="note-panel" style="margin-bottom:16px"><strong>Malla curricular:</strong> cada módulo incorpora Descubre → Aprende → Practica → Demuestra → Desbloquea. Las preguntas del examen final se gestionan en Banco de Preguntas.</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Orden</th><th>Nombre</th><th>Descripción</th><th>Duración</th><th>Acciones</th></tr></thead><tbody>${c.modules.map((m,i)=>`<tr><td>${i+1}</td><td><strong>${esc(m.title)}</strong><div class="smallprint">${esc(m.subtitle)}</div></td><td class="trunc">${esc(m.concept)}</td><td>${m.estimated} min</td><td><div class="data-actions"><button class="btn btn-small btn-outline" data-action="edit-module" data-id="${m.id}" data-course="${c.id}">Editar</button><button class="btn btn-small btn-danger" data-action="delete-module" data-id="${m.id}" data-course="${c.id}">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div>`}
 return`${section('Catálogo y malla curricular','Gestiona cursos, rutas, versiones, módulos y publicación.',button('+ Crear curso','create-course','btn-primary'))}<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Curso</th><th>Tipo / Pilar</th><th>Destinatarios</th><th>Módulos</th><th>Estado</th><th>Gestión</th></tr></thead><tbody>${data.courses.map(c=>`<tr><td><strong>${esc(c.title)}</strong><div class="smallprint">v${esc(c.version)} · ${c.duration} min</div></td><td>${esc(c.type)}<div class="smallprint">Pilar ${esc(c.pillar)}</div></td><td>${esc(c.roles.map(fmtRole).join(' · '))}</td><td>${c.modules.length}</td><td>${pill(c.published?'Publicado':'Borrador',c.published?'green':'orange')}</td><td><div class="data-actions"><button class="btn btn-small btn-primary" data-action="manage-course" data-id="${c.id}">Módulos</button><button class="btn btn-small btn-outline" data-action="edit-course" data-id="${c.id}">Editar</button><button class="btn btn-small btn-soft" data-action="toggle-course" data-id="${c.id}">${c.published?'Ocultar':'Publicar'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function adminQuestions(){const c=byId(ui.questionCourse)||data.courses[0],questions=data.questions.filter(q=>q.courseId===c.id);return`${section('Banco de preguntas','Edita preguntas, retroalimentación y controles críticos.',button('+ Nueva pregunta','create-question','btn-primary'))}<div class="filter-row"><label for="question-course" style="font-weight:800;font-size:11px">Seleccionar evaluación:</label><select id="question-course" class="select">${optionsFor(data.courses.map(c=>[c.id,c.title]),c.id)}</select>${pill(`${questions.length} preguntas disponibles`,'blue')}</div><div class="note-panel" style="margin-bottom:15px"><strong>Solo prototipo:</strong> las respuestas están en el código del navegador. No utilices exámenes confidenciales hasta implementar corrección en el backend.</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Pregunta</th><th>Respuesta esperada</th><th>Control crítico</th><th>Acciones</th></tr></thead><tbody>${questions.map(q=>`<tr><td>${esc(q.text)}</td><td>${esc(q.options[q.answer]||'')}</td><td>${q.critical?pill('Sí','red'):pill('No')}</td><td><div class="data-actions"><button class="btn btn-small btn-outline" data-action="edit-question" data-id="${q.id}">Editar</button><button class="btn btn-small btn-danger" data-action="delete-question" data-id="${q.id}">Eliminar</button></div></td></tr>`).join('')||'<tr><td colspan="4">Aún no existen preguntas para este curso.</td></tr>'}</tbody></table></div>`}
function adminRubrics(){const rubrics=data.rubrics||[];return`${section('Rúbrica multidimensional de onboarding','Modelo propuesto: 50% comportamientos + 50% BOT/reto.',button('+ Registrar observación','create-rubric','btn-primary'))}<div class="note-panel" style="margin-bottom:16px"><strong>Propuesta por aprobar:</strong> disciplina (20%), presentación (10%), disposición al aprendizaje (25%), recepción de feedback (20%) y comprensión conceptual (25%). Cada dimensión se califica de 1 a 5. El sistema calcula los componentes para revisión, pero NO confiere habilitación oficial.</div><div class="kpi-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:17px">${metric('👁️','Comportamientos','50%','Observación estructurada')}${metric('🎮','BOT / reto','50%','Simulación y controles','gold')}${metric('🛡️','Condición crítica','0 errores','Requisito adicional','green')}</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Colaborador</th><th>Comportamientos</th><th>BOT / reto</th><th>Resultado total</th><th>Quiz</th><th>Estado</th></tr></thead><tbody>${rubrics.length?rubrics.slice().reverse().map(r=>`<tr><td>${fmtDate(r.date,true)}</td><td><strong>${esc(data.users.find(u=>u.id===r.uid)?.name||'Perfil')}</strong></td><td>${r.behavior}/100</td><td>${r.bot}/100</td><td><strong>${r.total}/100</strong></td><td>${r.quiz===null?'Pendiente':`${r.quiz}%`}</td><td>${pill(r.status,r.pass?'green':'orange')}</td></tr>`).join(''):'<tr><td colspan="7">Aún no se han registrado rúbricas de demostración.</td></tr>'}</tbody></table></div>`}
function rubricFormModal(){showModal('Registrar rúbrica de prueba',`<form id="rubric-form"><div class="form-grid"><div class="form-field full"><label>Colaborador evaluado</label><select name="uid" class="select">${optionsFor(data.users.map(u=>[u.id,`${u.name} · ${fmtRole(u.role)}`]),me().id)}</select></div><div class="form-field full"><label>Evaluador</label><input name="evaluator" class="text-input" value="Formador Demo" required maxlength="80"></div>${[['discipline','Disciplina y puntualidad (20%)'],['professionalism','Presentación y profesionalismo (10%)'],['willingness','Disposición al aprendizaje (25%)'],['feedback','Recepción de feedback (20%)'],['understanding','Comprensión conceptual (25%)']].map(([key,name])=>`<div class="form-field"><label>${name}</label><select name="${key}" class="select">${optionsFor([[1,'1 · Inicial'],[2,'2 · En desarrollo'],[3,'3 · Aceptable'],[4,'4 · Sólido'],[5,'5 · Sobresaliente']],4)}</select></div>`).join('')}<div class="form-field"><label>Puntaje BOT / reto (0–100)</label><input name="bot" class="text-input" type="number" min="0" max="100" required value="85"></div><div class="form-field"><label>¿Hubo un error crítico?</label><select name="critical" class="select">${optionsFor([['no','No'],['yes','Sí']],'no')}</select></div><div class="form-field full"><label>Observaciones (sin datos de clientes)</label><textarea name="notes" class="textarea" maxlength="1000" placeholder="Evidencia observada y acción de mejora"></textarea></div></div><div class="note-panel" style="margin-top:14px">El examen de conocimiento se consulta del historial de demostración del perfil seleccionado. Si no existe un intento válido, el estado queda pendiente aunque el componente 50/50 alcance el umbral.</div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Calcular y guardar rúbrica</button></div></form>`,true)}
function adminMaterials(){return`${section('Recursos y materiales','Archivos del navegador para probar el flujo de carga, sin sincronización.',button('↑ Subir archivo de prueba','upload-material','btn-primary'))}<div class="callout" style="margin-bottom:16px"><div><h3>📁 Repositorio institucional</h3><p>Carpeta de Google Drive proporcionada. Aún NO conectada con esta versión HTML.</p></div><a class="btn btn-outline" href="${DRIVE_URL}" target="_blank" rel="noopener noreferrer">Abrir Drive ↗</a></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Archivo</th><th>Curso</th><th>Tamaño</th><th>Guardado en</th><th>Acciones</th></tr></thead><tbody>${data.materials.map(m=>`<tr><td><strong>📎 ${esc(m.name)}</strong></td><td>${esc(byId(m.courseId)?.title||'—')}</td><td>${(m.size/1024/1024).toFixed(2)} MB</td><td>Navegador · IndexedDB</td><td><div class="data-actions"><button class="btn btn-small btn-outline" data-action="view-file" data-id="${m.id}">Abrir</button><button class="btn btn-small btn-danger" data-action="delete-file" data-id="${m.id}">Eliminar</button></div></td></tr>`).join('')||'<tr><td colspan="5">Sin archivos cargados. Prueba la carga de un PDF, imagen o video.</td></tr>'}</tbody></table></div><p class="smallprint" style="margin-top:13px">La capacidad disponible depende de la cuota del navegador. Los archivos no se comparten con otras personas.</p>`}
function adminReports(){const attempts=data.attempts.slice().sort((a,b)=>b.date.localeCompare(a.date));return`${section('Reportes y analítica','Descarga datos de muestra para validar la estructura de indicadores.',`${button('↓ Exportar usuarios','export-users','btn-outline')}${button('↓ Exportar sesiones','export-sessions','btn-outline')}${button('↓ Exportar rúbricas','export-rubrics','btn-outline')}${button('↓ Exportar notas','export-attempts','btn-primary')}`)}<div class="note-panel" style="margin-bottom:17px"><strong>Datos de demo:</strong> las estadísticas solo abarcan las interacciones de este navegador y registros de muestra. No reflejan la actividad de colaboradores reales.</div>${attemptsTable(attempts)}${section('Actividad por persona','Tiempo acumulado y último ingreso')}<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Usuario</th><th>Rol</th><th>Tiempo activo</th><th>Nota promedio</th><th>Módulos terminados</th><th>Último acceso</th></tr></thead><tbody>${data.users.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(fmtRole(u.role))}</td><td>${fmtMinutes(u.activeSeconds||0)}</td><td>${scoreAvg(u.id)??'—'}</td><td>${data.completions.filter(x=>x.uid===u.id).length}</td><td>${fmtDate(u.lastLogin,true)}</td></tr>`).join('')}</tbody></table></div>`}
function adminConfig(){return`${section('Configuración del prototipo','Metas de referencia, repositorio previsto y reinicio de datos.') }<div class="admin-grid"><article class="card"><div class="card-header"><h3>🎯 Parámetros del proceso</h3></div><form id="config-form"><div class="form-grid"><label class="form-field"><span>Meta comportamientos observables (%)</span><input name="behaviors" class="text-input" type="number" min="0" max="100" required value="${data.settings.behaviors}"></label><label class="form-field"><span>Meta apropiación de conocimiento (%)</span><input name="knowledge" class="text-input" type="number" min="0" max="100" required value="${data.settings.knowledge}"></label><label class="form-field"><span>Meta satisfacción formativa (%)</span><input name="satisfaction" class="text-input" type="number" min="0" max="100" required value="${data.settings.satisfaction}"></label><label class="form-field"><span>Mínimo examen de demostración (%)</span><input name="quizPass" class="text-input" type="number" min="0" max="100" required value="${data.settings.quizPass}"></label><label class="form-field"><span>Mínimo práctica (rúbrica / 100)</span><input name="practicePass" class="text-input" type="number" min="0" max="100" required value="${data.settings.practicePass}"></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Guardar parámetros</button></div></form></article><div><article class="card"><div class="card-header"><h3>🗂️ Estado de la integración</h3>${pill('Desconectada','orange')}</div><p class="subtle" style="font-size:11px">Drive: repositorio de contenidos y evidencias.</p><p class="subtle" style="font-size:11px">Sheets: registros estructurados del piloto.</p><div class="note-panel"><strong>Próxima fase:</strong> autenticación, permisos de servidor, API segura, importación de usuarios y trazabilidad multiusuario. Ningún permiso de Google se gestiona desde este archivo.</div><a class="btn btn-outline btn-wide" style="margin-top:15px" href="${DRIVE_URL}" target="_blank" rel="noopener noreferrer">Abrir carpeta de referencia ↗</a></article><article class="card" style="margin-top:16px"><div class="card-header"><h3>♻️ Entorno de demostración</h3></div><p class="subtle" style="font-size:11px">El reinicio recupera usuarios, cursos y preguntas de muestra. Elimina la configuración y datos locales del prototipo.</p>${button('Reiniciar demo','reset-demo','btn-danger btn-wide')}</article></div></div>`}
function renderAdmin(){let tab='';switch(ui.adminTab){case'dashboard':tab=adminSummary();break;case'users':tab=adminUsers();break;case'courses':tab=adminCourses();break;case'questions':tab=adminQuestions();break;case'rubrics':tab=adminRubrics();break;case'materials':tab=adminMaterials();break;case'reports':tab=adminReports();break;case'config':tab=adminConfig();break;default:tab=adminSummary()}return`${head('⚙️ Administración','ALO Control Center','Panel editable de demostración: revisa la experiencia antes de conectar servicios reales.') }<div class="admin-banner"><div><h2>🕹️ El centro de control de tu Escuela</h2><p>Una plataforma fácil de administrar para que aprender también sea fácil.</p></div>${pill('⚠️ Acceso demo sin autenticación','orange')}</div><div class="tab-row">${ADMIN_TABS.map(([key,label])=>`<button class="tab-btn ${key===ui.adminTab?'active':''}" data-action="admin-tab" data-tab="${key}">${label}</button>`).join('')}</div>${tab}`}
function userFormModal(id){const u=data.users.find(x=>x.id===id);showModal(u?'Editar usuario de demostración':'Crear usuario de demostración',`<form id="user-form"><input type="hidden" name="id" value="${esc(u?.id||'')}"><div class="form-grid"><div class="form-field full"><label>Nombre completo *</label><input name="name" required maxlength="90" class="text-input" value="${esc(u?.name||'')}" placeholder="Nombre de prueba"></div><div class="form-field full"><label>Correo electrónico *</label><input name="email" required type="email" maxlength="160" class="text-input" value="${esc(u?.email||'')}" placeholder="usuario@ejemplo.test"></div><div class="form-field"><label>Rol formativo *</label><select name="role" class="select" required>${optionsFor(rolesOptions(false),u?.role||'cp')}</select></div><div class="form-field"><label>Estado</label><select name="status" class="select">${optionsFor([['Activo','Activo'],['Inactivo','Inactivo']],u?.status||'Activo')}</select></div><div class="form-field"><label>Área</label><input name="area" class="text-input" value="${esc(u?.area||'')}" placeholder="Área"></div><div class="form-field"><label>Gerencia</label><input name="gerencia" class="text-input" value="${esc(u?.gerencia||'')}" placeholder="Gerencia"></div><div class="form-field"><label>Cohorte</label><input name="cohort" class="text-input" value="${esc(u?.cohort||'Demo 2026')}" placeholder="Demo 2026"></div><div class="form-field"><label>Líder / mentor</label><input name="leader" class="text-input" value="${esc(u?.leader||'')}" placeholder="Mentor Demo"></div></div><div class="note-panel" style="margin-top:18px">Crea únicamente perfiles ficticios. El registro no genera cuentas de acceso reales.</div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${u?'Guardar cambios':'Crear usuario'}</button></div></form>`)}
function courseFormModal(id){const c=byId(id);showModal(c?'Editar curso':'Crear curso',`<form id="course-form"><input type="hidden" name="id" value="${esc(c?.id||'')}"><div class="form-grid"><div class="form-field full"><label>Nombre del curso *</label><input name="title" required maxlength="130" class="text-input" value="${esc(c?.title||'')}" placeholder="Ej. Atención efectiva al cliente"></div><div class="form-field"><label>Tipo de formación</label><select class="select" name="type">${optionsFor([['Onboarding','Onboarding'],['Formación continua','Formación continua'],['Liderazgo','Liderazgo'],['A la medida','A la medida']],c?.type||'A la medida')}</select></div><div class="form-field"><label>Pilar A.L.O.</label><select name="pillar" class="select">${optionsFor(Object.entries(PILLARS).map(([key,p])=>[key,p.name]),c?.pillar||'A')}</select></div><div class="form-field"><label>Dirigido a</label><select name="role" class="select">${optionsFor([['all','Todos los roles'],...rolesOptions(false)],c?.roles?.length===3?'all':c?.roles?.[0]||'cp')}</select></div><div class="form-field"><label>Duración (minutos)</label><input name="duration" class="text-input" type="number" min="1" max="10000" required value="${c?.duration||60}"></div><div class="form-field"><label>Emoji de portada</label><input name="icon" class="text-input" maxlength="4" value="${esc(c?.icon||'🚀')}"></div><div class="form-field"><label>Versión</label><input name="version" class="text-input" maxlength="15" value="${esc(c?.version||'1.0')}"></div><div class="form-field full"><label>Descripción *</label><textarea class="textarea" name="description" required maxlength="700">${esc(c?.description||'')}</textarea></div><div class="form-field full"><label class="check-label"><input type="checkbox" name="published" ${c?.published!==false?'checked':''}> Publicar curso en el catálogo del prototipo</label></div></div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar curso</button></div></form>`,true)}
function moduleFormModal(courseId,moduleId){const c=byId(courseId),m=c?.modules.find(x=>x.id===moduleId);if(!c)return;showModal(m?'Editar módulo':'Crear módulo',`<form id="module-form"><input type="hidden" name="courseId" value="${c.id}"><input type="hidden" name="id" value="${esc(m?.id||'')}"><div class="form-grid"><div class="form-field full"><label>Título *</label><input name="title" required class="text-input" value="${esc(m?.title||'')}"></div><div class="form-field"><label>Subtítulo / fase *</label><input name="subtitle" required class="text-input" value="${esc(m?.subtitle||'Misión práctica')}"></div><div class="form-field"><label>Duración (min)</label><input type="number" min="1" name="estimated" required class="text-input" value="${m?.estimated||25}"></div><div class="form-field full"><label>Descubre · historia o reto *</label><textarea name="story" required class="textarea">${esc(m?.story||'')}</textarea></div><div class="form-field full"><label>Aprende · conocimiento y criterios *</label><textarea name="concept" required class="textarea">${esc(m?.concept||'')}</textarea></div><div class="form-field full"><label>Practica · pregunta de decisión *</label><input name="practiceQ" required class="text-input" value="${esc(m?.practice?.q||'')}" placeholder="¿Qué harías ante esta situación?"></div>${[0,1,2].map(j=>`<div class="form-field full"><label>Opción ${String.fromCharCode(65+j)} *</label><input name="option${j}" class="text-input" required value="${esc(m?.practice?.options[j]||'')}"></div>`).join('')}<div class="form-field"><label>Respuesta correcta</label><select name="answer" class="select">${optionsFor([[0,'A'],[1,'B'],[2,'C']],m?.practice?.answer??0)}</select></div><div class="form-field"><label>Feedback</label><input name="feedback" class="text-input" value="${esc(m?.practice?.feedback||'')}" placeholder="Explica el criterio"></div><div class="form-field full"><label>Demuestra · pregunta de reflexión *</label><textarea name="reflection" class="textarea" required>${esc(m?.reflection||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar módulo</button></div></form>`,true)}
function questionFormModal(id){const q=data.questions.find(x=>x.id===id);showModal(q?'Editar pregunta':'Nueva pregunta',`<form id="question-form"><input type="hidden" name="id" value="${esc(q?.id||'')}"><div class="form-grid"><div class="form-field full"><label>Evaluación / curso</label><select name="courseId" class="select" required>${optionsFor(data.courses.map(c=>[c.id,c.title]),q?.courseId||ui.questionCourse)}</select></div><div class="form-field full"><label>Enunciado *</label><textarea name="text" class="textarea" required>${esc(q?.text||'')}</textarea></div>${[0,1,2].map(i=>`<div class="form-field full"><label>Opción ${String.fromCharCode(65+i)} *</label><input name="option${i}" class="text-input" required value="${esc(q?.options[i]||'')}"></div>`).join('')}<div class="form-field"><label>Respuesta correcta</label><select name="answer" class="select">${optionsFor([[0,'A'],[1,'B'],[2,'C']],q?.answer??0)}</select></div><div class="form-field"><label>Control crítico</label><select name="critical" class="select">${optionsFor([['no','No'],['yes','Sí']],q?.critical?'yes':'no')}</select></div><div class="form-field full"><label>Explicación / feedback</label><textarea name="explanation" class="textarea">${esc(q?.explanation||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar pregunta</button></div></form>`,true)}
function importUsersModal(){showModal('Importar usuarios · CSV',`<div class="note-panel"><strong>Formato esperado:</strong> nombre, correo, rol, area, gerencia, cohorte, lider. Roles aceptados: cp, cc o adm. Exporta desde Excel como CSV UTF-8.</div><form id="import-users-form"><div class="form-field" style="margin-top:15px"><label>Seleccionar archivo CSV de prueba</label><input name="file" type="file" class="text-input" accept=".csv,text/csv" required></div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Importar perfiles de prueba</button></div></form><p class="smallprint">No se envían correos, ni se generan cuentas reales. Evita utilizar información personal.</p>`)}
function materialFormModal(){showModal('Cargar archivo de prueba',`<div class="note-panel"><strong>Sin Drive:</strong> el archivo se almacenará únicamente en este navegador (IndexedDB). Para conectar Google Drive se necesita un backend autorizado.</div><form id="material-form"><div class="form-grid" style="margin-top:17px"><div class="form-field full"><label>Curso destinatario</label><select name="courseId" class="select" required>${optionsFor(data.courses.map(c=>[c.id,c.title]),ui.courseId||'onb-cp')}</select></div><div class="form-field full"><label>Material de prueba (hasta 20 MB)</label><div class="file-drop"><div style="font-size:42px">📤</div><p>PDF, imagen, video, audio o documento de ejemplo.</p><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.mp4,.mp3,.docx,.pptx" required></div></div></div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar en navegador</button></div></form>`)}
function helpModal(){showModal('Guía rápida · Escuela A.L.O.',`<div class="split-right"><div><h3>🎮 ¿Cómo probar la Escuela?</h3><ol class="reading-list"><li>Escoge un perfil en la esquina superior derecha.</li><li>Abre <b>Mi aventura A.L.O.</b> y juega los niveles de onboarding.</li><li>Selecciona respuestas y escribe reflexiones sin datos reales.</li><li>Completa una misión y observa cómo cambia tu avance y XP.</li><li>Visita <b>Evaluaciones</b> y realiza un examen disponible.</li><li>Abre <b>ALO Control Center</b> y crea un curso o pregunta.</li><li>Exporta un CSV para comprobar el seguimiento de demostración.</li></ol></div><div class="note-panel"><strong>Estado de implementación</strong><p>✓ Interfaz HTML navegable</p><p>✓ Datos de muestra y localStorage</p><p>✓ Subida local con IndexedDB</p><p>✗ Autenticación y permisos reales</p><p>✗ Google Drive / Sheets API</p><p>✗ Habilitación y certificados oficiales</p></div></div>`,true)}

function onboardingInfo(){showModal('Modelo de onboarding · Plan 2026',`<div class="level-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card clean"><h3>🧰 Día 0</h3><p>Alistamiento de equipo, accesos, permisos, agenda y líder.</p></div><div class="card clean"><h3>🌈 Días 1–2</h3><p>12 horas efectivas en identidad, producto, herramientas, práctica, controles y evaluación.</p></div><div class="card clean"><h3>🎮 Días 3–7</h3><p>Práctica supervisada con mentor, evidencia y rúbrica.</p></div><div class="card clean"><h3>⚡ Días 8–30</h3><p>Cuatro clínicas de 120 min (8 horas en total) con casos del puesto.</p></div></div><div class="note-panel" style="margin-top:14px"><strong>Umbrales propuestos:</strong> quiz ≥80%, práctica ≥85/100, total ≥80/100, cero críticos. La ponderación 50/50 sigue pendiente de validación formal.</div>`,true)}
