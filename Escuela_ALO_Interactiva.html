/* Persistencia de archivos DEMO (solo dispositivo actual). */
function openDemoDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB no disponible'));const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function storeFile(id,file){const db=await openDemoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function readFile(id){const db=await openDemoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)}})}
async function deleteFile(id){const db=await openDemoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
function dlBlob(fileName,blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csvValue(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return`"${s.replace(/"/g,'""')}"`}
function exportCSV(name,headers,rows){const csv='\uFEFF'+[headers,...rows].map(row=>row.map(csvValue).join(';')).join('\r\n');dlBlob(name,new Blob([csv],{type:'text/csv;charset=utf-8'}));toast('CSV generado para descargar.','success')}
function exportWhich(type){if(type==='template-users')return exportCSV('plantilla_usuarios_alo.csv',['nombre','correo','rol','area','gerencia','cohorte','lider'],[['Persona Ejemplo','persona@ejemplo.test','cp','Comercial','Presencial','Demo 2026-A','Mentor Demo']]);if(type==='export-users')return exportCSV('usuarios_alo_demo.csv',['ID','Nombre','Correo','Rol','Área','Gerencia','Cohorte','Líder','Estado','Último acceso'],data.users.map(u=>[u.id,u.name,u.email,fmtRole(u.role),u.area,u.gerencia,u.cohort,u.leader,u.status,u.lastLogin]));if(type==='export-sessions')return exportCSV('sesiones_alo_demo.csv',['ID sesión','UID','Inicio UTC','Cierre UTC','Segundos activos'],data.sessions.map(s=>[s.id,s.uid,s.start,s.end,s.seconds]));if(type==='export-rubrics')return exportCSV('rubricas_alo_demo.csv',['UID','Fecha','Conducta /100','BOT /100','Total /100','Quiz /100','Error crítico','Estado'],(data.rubrics||[]).map(r=>[r.uid,r.date,r.behavior,r.bot,r.total,r.quiz??'',r.critical?'Sí':'No',r.status]));if(type==='export-attempts')return exportCSV('evaluaciones_alo_demo.csv',['UID','Curso','Fecha UTC','Nota %','Correctas','Total','Aprueba','Error crítico'],data.attempts.map(a=>[a.uid,byId(a.courseId)?.title||a.courseId,a.date,a.score,a.correct,a.total,a.passed?'Sí':'No',a.criticalWrong?'Sí':'No']));if(type==='export-mine'){const u=me();return exportCSV('mi_progreso_alo_demo.csv',['UID','Nombre','Curso','Avance %','Nota último intento','Segundos activos'],data.courses.filter(c=>myCourse(c)).map(c=>[u.id,u.name,c.title,Math.round(courseProgress(c)),lastAttempt(c.id)?.score??'',u.activeSeconds]))}}
function parseCSV(content){let text=content.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');let first=text.split('\n')[0]||'';const delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],n=text[i+1];if(ch==='"'){if(quoted&&n==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(cell);cell=''}else if(ch==='\n'&&!quoted){row.push(cell);if(row.some(c=>c.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(c=>c.trim()))rows.push(row);return rows}
function startRolePreview(role){const u=data.users.find(x=>x.role===role&&x.status==='Activo');if(!u)return toast('Crea un perfil activo de este rol desde Administración.','error');switchUser(u.id);toast(`Vista de prueba: ${fmtRole(role)}`,'success')}
function switchUser(id){closeModal();if(!data.users.some(u=>u.id===id&&u.status==='Activo'))return;finishSession();data.currentUserId=id;data.users.find(u=>u.id===id).lastLogin=new Date().toISOString();startSession();ui.page='home';ui.adminCourse=null;render();window.scrollTo(0,0)}
function openCourse(courseId,moduleIndex=undefined){const c=byId(courseId);if(!c||!c.modules.length)return toast('Curso sin módulos. Configura su malla desde Administración.','error');let next=moduleIndex===undefined?c.modules.findIndex(m=>!compl(me().id,m.id)):Number(moduleIndex);if(next<0)next=c.modules.length-1;if(!isUnlocked(c,next))return toast('Supera el nivel anterior para desbloquear.','error');move('course',{courseId,moduleIndex:next})}
function runAction(action,el){const id=el?.dataset?.id,idx=Number(el?.dataset?.index??0),course=el?.dataset?.course;
 switch(action){
 case'close-modal':case'overlay-close':closeModal();break;
 case'toggle-nav':document.getElementById('sidebar').classList.toggle('open');document.getElementById('nav-overlay').hidden=!document.getElementById('sidebar').classList.contains('open');break;
 case'concept':conceptModal();break;case'help':helpModal();break;case'onboarding-info':onboardingInfo();break;case'quiz-info':quizInfo();break;case'certificate':certificateModal();break;case'print-certificate':window.print();break;
 case'go-catalog':move('catalog');break;case'go-onboarding':move('onboarding');closeModal();break;case'go-evaluations':move('evaluations');break;case'go-badges':move('badges');break;
 case'go-course-origin':move(byId(ui.courseId)?.type==='Onboarding'?'onboarding':'catalog');break;
 case'continue-onboarding':openCourse(myOnboarding().id);break;
 case'open-course':openCourse(id);break;
 case'open-level':openCourse(id,idx);break;
 case'role-preview':startRolePreview(el.dataset.role);break;
 case'role-modal':showModal('Explora las rutas por rol',`<div class="role-grid">${Object.entries(ROLES).map(([key,r])=>`<button class="role-tile ${key===me().role?'selected':''}" data-action="role-preview" data-role="${key}"><span class="role-icon">${r.icon}</span><b>${r.label}</b></button>`).join('')}</div><p class="smallprint" style="margin-top:16px">Cambiar de rol selecciona otro perfil ficticio. No edita la identidad de una cuenta real.</p>`);break;
 case'select-module':if(isUnlocked(byId(ui.courseId),idx)){ui.moduleIndex=idx;ui.phase=0;ui.reflection='';ui.practiceChecked=false;ui.practiceAnswer=null;render();window.scrollTo(0,0)}break;
 case'phase-jump':if(idx<=ui.phase){ui.phase=idx;render()}break;
 case'phase-back':ui.phase=Math.max(0,ui.phase-1);render();break;
 case'phase-next':{
  const m=byId(ui.courseId)?.modules[ui.moduleIndex];if(ui.phase===2&&(!ui.practiceChecked||ui.practiceAnswer!==m.practice.answer))return toast('Resuelve el microreto correctamente para seguir.','error');if(ui.phase===3&&ui.reflection.trim().length<12)return toast('Escribe una reflexión de al menos 12 caracteres.','error');ui.phase=Math.min(4,ui.phase+1);render();break}
 case'practice-pick':ui.practiceAnswer=idx;ui.practiceChecked=false;render();break;
 case'check-practice':if(ui.practiceAnswer===null)return toast('Escoge primero una respuesta.','error');ui.practiceChecked=true;render();break;
 case'finish-module':finishModule();break;
 case'next-module':{const c=byId(ui.courseId);if(ui.moduleIndex<c.modules.length-1)openCourse(c.id,ui.moduleIndex+1);else move('evaluations');break}
 case'start-quiz':startQuiz(id||ui.courseId);break;
 case'quiz-pick':{const q=ui.quiz,question=quizQuestions()[q.index];q.answers[question.id]=idx;render();break}
 case'quiz-prev':ui.quiz.index=Math.max(0,ui.quiz.index-1);render();break;
 case'quiz-next':{const question=quizQuestions()[ui.quiz.index];if(ui.quiz.answers[question.id]===undefined)return toast('Selecciona una respuesta para continuar.','error');ui.quiz.index=Math.min(quizQuestions().length-1,ui.quiz.index+1);render();break}
 case'quiz-submit':endQuiz();break;case'retry-quiz':startQuiz(ui.quiz.courseId);break;
 case'open-leadership':openCourse('coaching');break;
 case'admin-tab':ui.adminTab=el.dataset.tab;ui.adminCourse=null;render();break;
 case'admin-materials':ui.adminTab='materials';move('admin');break;
 case'admin-courses-back':ui.adminCourse=null;render();break;
 case'create-user':userFormModal();break;case'edit-user':userFormModal(id);break;
 case'toggle-user':{const u=data.users.find(x=>x.id===id);if(!u)return;u.status=u.status==='Activo'?'Inactivo':'Activo';if(me().status==='Inactivo'){const active=data.users.find(x=>x.status==='Activo');if(active)data.currentUserId=active.id}save();render();toast(`Perfil ${u.status.toLowerCase()}.`,'success');break}
 case'import-users':importUsersModal();break;
 case'create-course':courseFormModal();break;case'edit-course':courseFormModal(id);break;
 case'manage-course':ui.adminCourse=id;ui.adminTab='courses';render();break;
 case'toggle-course':{const c=byId(id);if(!c)return;c.published=!c.published;save();render();toast(c.published?'Curso publicado en el catálogo demo.':'Curso oculto del catálogo.','success');break}
 case'create-module':moduleFormModal(id||ui.adminCourse);break;
 case'edit-module':moduleFormModal(course,id);break;
 case'delete-module':{const c=byId(course);if(!c||c.modules.length===1)return toast('El curso debe conservar al menos un módulo.','error');if(!confirm('¿Eliminar este módulo y sus datos asociados de la demo?'))return;c.modules=c.modules.filter(x=>x.id!==id);data.completions=data.completions.filter(x=>x.moduleId!==id);save();render();toast('Módulo eliminado.','success');break}
 case'create-question':questionFormModal();break;case'create-rubric':rubricFormModal();break;case'edit-question':questionFormModal(id);break;
 case'delete-question':if(!confirm('¿Eliminar esta pregunta del banco de muestra?'))return;data.questions=data.questions.filter(x=>x.id!==id);save();render();toast('Pregunta eliminada.','success');break;
 case'upload-material':materialFormModal();break;
 case'view-file':(async()=>{try{const f=await readFile(id);if(!f)return toast('No se encontró el archivo local.','error');const meta=data.materials.find(m=>m.id===id);const url=URL.createObjectURL(f);if(/^(image\/|audio\/|video\/|application\/pdf)/.test(f.type)){const win=window.open(url,'_blank','noopener,noreferrer');if(!win){dlBlob(meta?.name||'material',f)}else setTimeout(()=>URL.revokeObjectURL(url),60000)}else{dlBlob(meta?.name||'material',f);URL.revokeObjectURL(url)}}catch(e){toast('No se pudo abrir el archivo local.','error')}})();break;
 case'delete-file':(async()=>{if(!confirm('¿Eliminar el archivo guardado en este navegador?'))return;try{await deleteFile(id);data.materials=data.materials.filter(x=>x.id!==id);save();render();toast('Material eliminado.','success')}catch(e){toast('Error al eliminar material.','error')}})();break;
 case'template-users':case'export-users':case'export-sessions':case'export-attempts':case'export-rubrics':case'export-mine':exportWhich(action);break;
 case'reset-demo':showModal('Reiniciar datos de demostración',`<p>Se eliminarán los usuarios, cursos y notas creados en este navegador. Esta acción no modifica Google Drive.</p><div class="form-actions">${button('Cancelar','close-modal','btn-outline')}${button('Sí, reiniciar','confirm-reset','btn-danger')}</div>`);break;
 case'confirm-reset':{try{indexedDB.deleteDatabase(DB_NAME)}catch(e){}localStorage.removeItem(STORAGE_KEY);closeModal();data=createSeed();startSession();save();ui.adminCourse=null;move('home');toast('Demo restablecida.','success');break}
 default:console.warn('Acción no reconocida:',action);
 }
}
function handleForm(e){const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();const fd=new FormData(f);const value=k=>String(fd.get(k)||'').trim();
 if(f.getAttribute('id')==='user-form'){
  const id=value('id'),email=value('email').toLowerCase(),name=value('name');if(!name||!email)return toast('Completa nombre y correo.','error');if(data.users.some(x=>x.email.toLowerCase()===email&&x.id!==id))return toast('Ya existe un usuario de muestra con este correo.','error');const record={name,email,role:value('role'),area:value('area'),gerencia:value('gerencia'),cohort:value('cohort'),leader:value('leader'),status:value('status')};if(id){Object.assign(data.users.find(x=>x.id===id),record)}else data.users.push({id:UID(),...record,createdAt:new Date().toISOString(),lastLogin:null,activeSeconds:0,xp:0});save();closeModal();render();toast(id?'Usuario actualizado.':'Usuario de muestra creado.','success');return
 }
 if(f.getAttribute('id')==='course-form'){
  const id=value('id'),role=value('role'),title=value('title'),desc=value('description');if(!title||!desc)return toast('Completa título y descripción.','error');const record={title,description:desc,type:value('type'),pillar:value('pillar'),roles:role==='all'?['cp','cc','adm']:[role],duration:Number(value('duration')),icon:value('icon')||'🚀',color:({A:'orange',L:'gold',O:'green'}[value('pillar')]),version:value('version')||'1.0',published:fd.has('published')};let c;if(id){c=byId(id);Object.assign(c,record)}else{const courseId=UID();c={id:courseId,...record,modules:[mod(`${courseId}-m1`,'Primera misión','Introducción al tema','Tu equipo necesita resolver un desafío y aplicar conocimientos vigentes.','Antes de decidir, identifica el proceso y las verificaciones correspondientes.',mkPractice('¿Cómo debe iniciarse la solución?',['Verificando información y controles aplicables.','Evitando los procedimientos.','Tomando decisiones sin evidencia.'],0,'La evidencia permite corregir y mejorar.'),'¿Qué verificarías primero?',25)]};data.courses.push(c)}save();closeModal();ui.adminTab='courses';ui.adminCourse=c.id;move('admin');toast('Curso guardado en el catálogo local.','success');return
 }
 if(f.getAttribute('id')==='module-form'){
  const c=byId(value('courseId')),id=value('id');if(!c)return;const m={title:value('title'),subtitle:value('subtitle'),estimated:Number(value('estimated')),story:value('story'),concept:value('concept'),practice:{q:value('practiceQ'),options:[value('option0'),value('option1'),value('option2')],answer:Number(value('answer')),feedback:value('feedback')},reflection:value('reflection')};if(id){const original=c.modules.find(x=>x.id===id);Object.assign(original,m)}else c.modules.push({id:UID(),...m});save();closeModal();ui.adminCourse=c.id;render();toast('Módulo guardado.','success');return
 }
 if(f.getAttribute('id')==='question-form'){
  const id=value('id'),item={courseId:value('courseId'),text:value('text'),options:[value('option0'),value('option1'),value('option2')],answer:Number(value('answer')),explanation:value('explanation'),critical:value('critical')==='yes'};if(id){Object.assign(data.questions.find(x=>x.id===id),item)}else data.questions.push({id:UID(),...item});ui.questionCourse=item.courseId;save();closeModal();render();toast('Pregunta guardada.','success');return
 }
 if(f.getAttribute('id')==='import-users-form'){
  (async()=>{const file=fd.get('file');if(!(file instanceof File))return toast('Selecciona un CSV.','error');try{const rows=parseCSV(await file.text());if(rows.length<2)return toast('El archivo no contiene registros.','error');const headers=rows[0].map(x=>x.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));const col=(row,aliases)=>{const i=headers.findIndex(h=>aliases.includes(h));return i<0?'':(row[i]||'').trim()};let created=0,skipped=0;for(const row of rows.slice(1)){
   const name=col(row,['nombre','name','nombre completo','nombre_completo']),email=col(row,['correo','email','correo electronico','correo_electronico']).toLowerCase(),rawRole=col(row,['rol','role','perfil']).toLowerCase();let role=['cp','cc','adm'].includes(rawRole)?rawRole:rawRole.includes('contact')?'cc':rawRole.includes('admin')?'adm':rawRole.includes('comercial')?'cp':'';if(!name||!email.includes('@')||!role||data.users.some(u=>u.email.toLowerCase()===email)){skipped++;continue}data.users.push({id:UID(),name,email,role,area:col(row,['area']),gerencia:col(row,['gerencia']),cohort:col(row,['cohorte','cohort']),leader:col(row,['lider','mentor','leader']),status:'Activo',createdAt:new Date().toISOString(),lastLogin:null,activeSeconds:0,xp:0});created++}save();closeModal();render();toast(`Importación: ${created} creados, ${skipped} omitidos.`,created?'success':'error')}catch(err){console.error(err);toast('No se pudo leer el CSV.','error')}})();return
 }
 if(f.getAttribute('id')==='material-form'){
  (async()=>{const file=fd.get('file');if(!(file instanceof File)||!file.size)return toast('Selecciona un archivo.','error');if(file.size>20*1024*1024)return toast('Máximo permitido en demo: 20 MB.','error');const allowed=/\.(pdf|png|jpe?g|webp|mp4|mp3|docx|pptx)$/i;if(!allowed.test(file.name))return toast('Tipo de archivo no admitido en esta demostración.','error');const id=UID();try{await storeFile(id,file);data.materials.push({id,courseId:value('courseId'),name:file.name,mime:file.type,size:file.size,createdAt:new Date().toISOString(),storage:'IndexedDB-local'});save();closeModal();ui.adminTab='materials';move('admin');toast('Archivo almacenado SOLO en el navegador.','success')}catch(err){console.error(err);toast('No se pudo guardar el archivo local.','error')}})();return
 }
 if(f.getAttribute('id')==='rubric-form'){
  const uid=value('uid'),u=data.users.find(x=>x.id===uid);if(!u)return toast('Usuario no encontrado.','error');const weights=[['discipline',20],['professionalism',10],['willingness',25],['feedback',20],['understanding',25]];const items=weights.map(([k,w])=>({key:k,weight:w,score:clamp(Number(value(k)),1,5)}));const behavior=Math.round(items.reduce((s,item)=>s+(item.score/5)*item.weight,0));const bot=clamp(Number(value('bot')),0,100);const critical=value('critical')==='yes';const quiz=lastAttempt(`onb-${u.role}`,uid)?.score??null;const total=Math.round((behavior+bot)/2);const pass=total>=80&&bot>=data.settings.practicePass&&quiz!==null&&quiz>=data.settings.quizPass&&!critical;const status=pass?'Cumple umbrales demo · pendiente validación':quiz===null?'Pendiente quiz':'Requiere refuerzo';data.rubrics.push({id:UID(),uid,date:new Date().toISOString(),evaluator:value('evaluator'),items,behavior,bot,quiz,total,critical,pass,status,notes:value('notes'),source:'demostracion'});save();closeModal();ui.adminTab='rubrics';render();toast(`Rúbrica guardada: ${total}/100. ${status}`,'success');return
 }
 if(f.getAttribute('id')==='config-form'){
  for(const k of ['behaviors','knowledge','satisfaction','quizPass','practicePass'])data.settings[k]=clamp(Number(value(k)),0,100);save();render();toast('Parámetros actualizados para esta demo.','success');return
 }
}
/* Sesiones y tiempo activo estimado en localStorage; nunca se presenta como telemetría verificada. */
let currentSessionId=null,lastActivity=Date.now(),tickCounter=0;const tabId=UID();const LEASE_KEY='ESCUELA_ALO_DEMO_ACTIVE_TAB';
function startSession(){const s={id:UID(),uid:me().id,start:new Date().toISOString(),end:null,seconds:0};data.sessions.push(s);currentSessionId=s.id;me().lastLogin=s.start;save()}
function finishSession(){if(!currentSessionId)return;const s=data.sessions.find(x=>x.id===currentSessionId);if(s&&!s.end)s.end=new Date().toISOString();currentSessionId=null;save()}
function timerTick(){if(document.visibilityState==='hidden'||Date.now()-lastActivity>60000)return;try{const now=Date.now();const lease=JSON.parse(localStorage.getItem(LEASE_KEY)||'null');if(lease&&lease.id!==tabId&&lease.expires>now)return;if(tickCounter%6===0)localStorage.setItem(LEASE_KEY,JSON.stringify({id:tabId,expires:now+12000}))}catch(e){}const s=data.sessions.find(x=>x.id===currentSessionId);if(!s)return;s.seconds++;me().activeSeconds=(me().activeSeconds||0)+1;tickCounter++;if(tickCounter%12===0){save();if(ui.page==='progress'||ui.page==='home')updateLiveCounters()}}
function updateLiveCounters(){// Re-render metrics at a modest cadence; avoids resetting the visitor's focus during forms.
 const focused=document.activeElement;if(focused?.tagName==='INPUT'||focused?.tagName==='TEXTAREA'||focused?.tagName==='SELECT')return;render()}
['pointerdown','keydown','touchstart','scroll'].forEach(event=>document.addEventListener(event,()=>lastActivity=Date.now(),{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lastActivity=Date.now();save()});
window.addEventListener('pagehide',finishSession);
/* Navegación, acciones y formularios. */
document.addEventListener('click',ev=>{if(ev.target.closest('a'))return;const nav=ev.target.closest('[data-nav]');if(nav){move(nav.dataset.nav);return}const btn=ev.target.closest('[data-action]');if(btn){if(btn.dataset.action==='overlay-close'&&ev.target!==btn)return;ev.preventDefault();runAction(btn.dataset.action,btn)}});
document.getElementById('nav-overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('nav-overlay').hidden=true});
document.addEventListener('change',ev=>{const el=ev.target;if(el.getAttribute('id')==='switch-user'){switchUser(el.value);return}if(el.getAttribute('id')==='filter-role'){ui.filterRole=el.value;render();return}if(el.getAttribute('id')==='filter-type'){ui.filterType=el.value;render();return}if(el.getAttribute('id')==='filter-pillar'){ui.filterPillar=el.value;render();return}if(el.getAttribute('id')==='question-course'){ui.questionCourse=el.value;render();return}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.getAttribute('id')==='catalog-search'){const caret=el.selectionStart;ui.search=el.value;const place=document.activeElement===el;document.getElementById('page-root').innerHTML=renderCatalog();const fresh=document.getElementById('catalog-search');if(place){fresh.focus();fresh.setSelectionRange(caret,caret)}}if(el.getAttribute('id')==='reflect-text'){ui.reflection=el.value}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if(ev.key==='Enter'&&ev.target.getAttribute('id')==='global-search'){ev.preventDefault();ui.search=ev.target.value.trim();ui.page='catalog';ui.filterRole='all';render();document.getElementById('catalog-search')?.focus()}});
document.addEventListener('submit',handleForm);
// Start page
startSession();render();setInterval(timerTick,1000);
})();

</script>
